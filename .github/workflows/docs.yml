name: rustdocs

# Build the workspace rustdocs and publish them to GitHub Pages on every push
# to `main` (issue #156 originally published to an S3 bucket; Pages is the
# GitHub-native equivalent).
#
# Kept out of ci.yml so a Pages problem can never turn the correctness gate
# red. GitHub Pages is unavailable for private repositories on free plans, so
# the deploy is gated on the repository being public; while it is private the
# workflow is a no-op. One-time setup once public: Settings -> Pages ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `protoc` (+ the well-known .proto includes in -dev) is required by the
      # envd crate's build.rs; see ci.yml's rust job.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo doc
        run: cargo doc --workspace --no-deps
      # `cargo doc --workspace` writes one directory per crate but no top-level
      # index.html (the workspace landing page is nightly-only), so synthesize
      # a minimal landing page linking each crate.
      - name: Synthesize landing page
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>sandbawks workspace documentation</title>'
            echo '<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.5}h1{font-size:1.5rem}li{margin:.35rem 0}code{background:#0001;padding:0 .2rem;border-radius:.2rem}</style>'
            echo '</head><body>'
            echo '<h1>sandbawks workspace documentation</h1>'
            echo '<p>Generated by <code>cargo doc --workspace --no-deps</code> on every push to <code>main</code>.</p>'
            echo '<ul>'
            for index in target/doc/*/index.html; do
              crate=$(basename "$(dirname "$index")")
              echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
            done
            echo '</ul></body></html>'
          } > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
