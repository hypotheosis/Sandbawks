name: docs

# Build the user docs site (Astro Starlight, in `site/`) and the workspace
# rustdocs, and publish both to GitHub Pages as one site on every push to
# `main`: the docs at https://hypotheosis.github.io/Sandbawks/ and the rustdocs
# under /Sandbawks/api/. A repository gets a single Pages site, so both go in
# one artifact (issue #156 originally published the rustdocs to an S3 bucket).
#
# Kept out of ci.yml so a Pages problem can never turn the correctness gate
# red. GitHub Pages is unavailable for private repositories on free plans, so
# the deploy is gated on the repository being public; while it is private the
# workflow is a no-op. One-time setup once public: Settings -> Pages ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build docs site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      # `protoc` (+ the well-known .proto includes in -dev) is required by the
      # envd crate's build.rs; see ci.yml's rust job.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo doc
        run: cargo doc --workspace --no-deps
      # `cargo doc --workspace` writes one directory per crate but no top-level
      # index.html (the workspace landing page is nightly-only), so synthesize
      # a minimal landing page linking each crate. It becomes /Sandbawks/api/.
      - name: Synthesize landing page
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>sandbawks workspace documentation</title>'
            echo '<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.5}h1{font-size:1.5rem}li{margin:.35rem 0}code{background:#0001;padding:0 .2rem;border-radius:.2rem}</style>'
            echo '</head><body>'
            echo '<h1>sandbawks workspace documentation</h1>'
            echo '<p>Generated by <code>cargo doc --workspace --no-deps</code> on every push to <code>main</code>. The user documentation is <a href="../">here</a>.</p>'
            echo '<ul>'
            for index in target/doc/*/index.html; do
              crate=$(basename "$(dirname "$index")")
              echo "<li><a href=\"${crate}/index.html\">${crate}</a></li>"
            done
            echo '</ul></body></html>'
          } > target/doc/index.html
      - name: Put the rustdocs under /api/
        run: cp -r target/doc site/dist/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
