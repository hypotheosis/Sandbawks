apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtemplates.sandbawks.dev
spec:
  group: sandbawks.dev
  names:
    categories: []
    kind: SandboxTemplate
    plural: sandboxtemplates
    shortNames:
    - sbxtpl
    singular: sandboxtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.defaultRuntimeClass
      name: Runtime
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SandboxTemplateSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A reusable definition for a class of sandboxes.

              Templates capture the OCI image + sensible defaults (resources, runtime class, timeout, envd build). Per-Sandbox spec values override the template defaults.
            properties:
              defaultResources:
                description: Resource defaults applied when the Sandbox doesn't specify them.
                properties:
                  cpu:
                    type: string
                  ephemeralStorage:
                    nullable: true
                    type: string
                  memory:
                    type: string
                required:
                - cpu
                - memory
                type: object
              defaultRuntimeClass:
                description: RuntimeClass name to use unless the Sandbox overrides it.
                type: string
              defaultTimeoutSeconds:
                description: Default timeout in seconds.
                format: uint32
                minimum: 0.0
                type: integer
              envdImage:
                description: |-
                  envd-rs binary carrier image (separate from [`Self::image`] so envd can be updated independently of the customer's rootfs).

                  NOTE (issue #265/#273): with node-staged envd delivery, the cold-start and restore paths use the *cluster-wide* envd binary the `sandbawks-node` DaemonSet stages (Helm `envd.image`); this per-template field is currently **not** consumed on those paths. It is therefore **optional** — omit it unless and until per-template envd staging is revived (issue #270). Setting it today is a no-op.

                  `Option<T>` makes the field non-required in the generated CRD schema; `skip_serializing_if` keeps `None` out of serialized YAML rather than emitting an explicit `envdImage: null`.
                nullable: true
                type: string
              image:
                description: 'OCI image reference for the sandbox''s rootfs (the customer''s tooling). envd does **not** need to be baked in: the `sandbawks-node` DaemonSet stages the static envd binary onto the node and the controller mounts it read-only into this image, running it as the container entrypoint (issue #265).'
                type: string
              networkPolicy:
                description: |-
                  Workload egress baseline for every sandbox minted from this template (issue #537). Propagated by the controller/gateway into each minted `Sandbox.spec.networkPolicy`, so both cold-start *and* warm-pool members inherit it without hand-editing the resulting CR — closing the gap where `egressAllow` existed on `Sandbox` but no surface wired it through.

                  `None` (or an empty `egressAllow`) leaves minted sandboxes at the default-deny-egress baseline (issue #443). A per-create request may add further destinations on top of this baseline; the two are combined as a union by [`crate::merge_egress_policies`].

                  `Option<T>` keeps the field non-required in the generated CRD schema and `skip_serializing_if` keeps `None` out of serialized YAML rather than emitting `networkPolicy: null`.
                nullable: true
                properties:
                  egressAllow:
                    default: []
                    description: |-
                      Egress destinations to permit. Empty means deny-all egress (the default-deny baseline is unchanged).

                      IP/CIDR entries (`10.0.0.0/8`, `2001:db8::1`) become exact `ipBlock` egress rules. DNS-name entries cannot be encoded as destinations in a standard NetworkPolicy, so their presence instead opens DNS egress (port 53) and relies on the cluster's name-aware CNI layer (Cilium FQDN policy) to enforce the resolved destination.
                    items:
                      type: string
                    type: array
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: 'Node-selector labels every sandbox minted from this template inherits (issue #592), pinning its Pod to a labeled node pool. Propagated into each minted Pod''s `spec.nodeSelector` alongside [`Self::tolerations`]; same propagation path and `None`-default semantics.'
                nullable: true
                type: object
              persistenceMode:
                description: |-
                  Persistence strategy every sandbox minted from this template inherits (epic #603), unless the Sandbox overrides it. Propagated into each minted Sandbox's [`crate::SandboxSpec::persistence_mode`] at the controller's pod-creation edge (`resolve_pod_inputs`), so both cold-start *and* warm-pool members pick it up without hand-editing the CR — mirroring how `tolerations` / `nodeSelector` flow down.

                  `None` (the default) leaves minted sandboxes at the effective default [`PersistenceMode::Snapshot`] — current behavior, unchanged. `Option<T>` keeps the field non-required in the generated CRD schema and `skip_serializing_if` keeps `None` out of serialized YAML rather than emitting `persistenceMode: null`.
                enum:
                - Snapshot
                - Filesystem
                nullable: true
                type: string
              securityContext:
                description: |-
                  Pod-level security context every sandbox minted from this template inherits (issue #617), stamped onto its Pod's `spec.securityContext` — most importantly `fsGroup`, so a non-root container can write to a dynamically provisioned `volumeClaimTemplates` PVC. Propagated into each minted Sandbox's [`crate::SandboxSpec::security_context`] at the controller's pod-creation edge ([`resolve_pod_inputs`]) alongside [`Self::tolerations`] / [`Self::node_selector`]; same propagation path and `None`-default semantics (`None` ⇒ no `securityContext`, unchanged).

                  [`resolve_pod_inputs`]: ../../sandbawks_controller/reconcile/fn.resolve_pod_inputs.html
                nullable: true
                properties:
                  fsGroup:
                    description: Supplemental GID that owns the Pod's volumes. The kubelet recursively chowns each volume to `root:fsGroup` with the setgid bit, so a container running as any UID that has this GID can write — the fix for a root-owned `volumeClaimTemplates` PVC.
                    format: int64
                    nullable: true
                    type: integer
                  fsGroupChangePolicy:
                    description: 'When the kubelet applies [`Self::fs_group`] ownership: `Always` (chown every mount) or `OnRootMismatch` (skip when the top-level dir already matches — far cheaper for large, already-correct volumes).'
                    nullable: true
                    type: string
                  runAsGroup:
                    description: Primary GID every container in the Pod runs as.
                    format: int64
                    nullable: true
                    type: integer
                  runAsNonRoot:
                    description: Require all containers to run as a non-root user; the kubelet refuses to start the Pod if a container would run as UID 0.
                    nullable: true
                    type: boolean
                  runAsUser:
                    description: UID every container in the Pod runs as (unless a container overrides it).
                    format: int64
                    nullable: true
                    type: integer
                  supplementalGroups:
                    description: Extra GIDs added to every container's process, beyond the primary group.
                    items:
                      format: int64
                      type: integer
                    type: array
                type: object
              tolerations:
                description: |-
                  Scheduling tolerations every sandbox minted from this template inherits (issue #592), letting its Pod schedule onto tainted nodes — e.g. a dedicated Kata/Azure node pool whose taint repels untolerated Pods. Propagated by the controller into each minted Pod's `spec.tolerations` at the pod-creation edge (`resolve_pod_inputs`), so both cold-start *and* warm-pool members pick it up without hand-editing the resulting CR — mirroring how `networkPolicy` / `defaultRuntimeClass` flow down. Composes with the controller's internal runsc-version node affinity rather than replacing it.

                  `None` (the default) leaves minted Pods with no extra tolerations, scheduled exactly as today. `Option<T>` keeps the field non-required in the generated CRD schema and `skip_serializing_if` keeps `None` out of serialized YAML rather than emitting `tolerations: null`.
                items:
                  description: |-
                    A pod scheduling toleration: a serde/schemars-friendly mirror of `k8s_openapi::api::core::v1::Toleration` (issue #592).

                    We mirror rather than reuse the `k8s_openapi` type because this crate's CRDs derive [`schemars::JsonSchema`] to emit their OpenAPI v3 schema, and the `k8s-openapi` types do not implement `JsonSchema` under the features this workspace enables. The field set and wire shape (camelCase `tolerationSeconds`) match the upstream type exactly, so the controller converts losslessly into the `k8s_openapi` `Toleration` when building the `PodSpec`. See the same mirror rationale on [`NetworkPolicy`].
                  properties:
                    effect:
                      description: Taint effect to match. Empty matches all effects. One of `NoSchedule`, `PreferNoSchedule`, `NoExecute`.
                      nullable: true
                      type: string
                    key:
                      description: 'Taint key the toleration applies to. Empty (with `operator: Exists`) matches all keys.'
                      nullable: true
                      type: string
                    operator:
                      description: Relationship between key and value. `Exists` (value must be empty) or `Equal` (the default when unset, per Kubernetes).
                      nullable: true
                      type: string
                    tolerationSeconds:
                      description: For a `NoExecute` toleration, how long (seconds) the Pod stays bound after the taint is added. Unset means tolerate forever.
                      format: int64
                      nullable: true
                      type: integer
                    value:
                      description: 'Taint value the toleration matches (empty with `operator: Exists`).'
                      nullable: true
                      type: string
                  type: object
                nullable: true
                type: array
              volumeClaimTemplates:
                description: 'PVC requests every sandbox minted from this template inherits (epic #603), unless the Sandbox sets its own. Propagated into each minted Sandbox''s [`crate::SandboxSpec::volume_claim_templates`] alongside [`Self::persistence_mode`]; same propagation path and `None`-default semantics. The PVC objects are provisioned and mounted in #603 Phase 2.'
                items:
                  description: |-
                    A request for a sandbox-owned `PersistentVolumeClaim`, modeled on a StatefulSet's / `kubernetes-sigs/agent-sandbox`'s `volumeClaimTemplates` (epic #603). Each entry yields one PVC the controller provisions and mounts into the sandbox Pod (#603 Phase 2); the PVC outlives the Pod across a `filesystem`-mode pause so the sandbox's files survive resume.

                    [`Self::spec`] is a serde/schemars-friendly mirror of the subset of `k8s_openapi::api::core::v1::PersistentVolumeClaimSpec` a dynamically provisioned workspace volume needs. We mirror rather than embed the upstream type for the same reason as [`Toleration`] / [`NetworkPolicy`]: this crate's CRDs derive [`schemars::JsonSchema`] to emit their OpenAPI v3 schema, and the `k8s-openapi` types do not implement `JsonSchema` under the features this workspace enables. The field semantics match the upstream type, so the controller converts into a `k8s_openapi` PVC spec when provisioning (#603 Phase 2).
                  properties:
                    metadata:
                      description: PVC object metadata. The `name` distinguishes this claim within the sandbox and seeds the materialized PVC's name (#603 Phase 2).
                      properties:
                        annotations:
                          additionalProperties:
                            type: string
                          description: Extra annotations stamped onto the materialized PVC.
                          type: object
                        labels:
                          additionalProperties:
                            type: string
                          description: Extra labels stamped onto the materialized PVC.
                          type: object
                        name:
                          description: |-
                            Volume name, unique within the sandbox. Combined with the sandbox name to form the materialized PVC's name and used as the Pod volume name when mounted (#603 Phase 2).

                            Constrained to a **DNS-1123 label** (lowercase alphanumerics plus `-`, starting/ending alphanumeric, ≤63 chars) by the `pattern`/`maxLength` emitted into the CRD schema (#605 review). This is the *stricter* of the two downstream Kubernetes name rules the value must satisfy — it is used verbatim as the Pod **volume name** (a DNS-1123 label, no dots) and, with the `sbx-<id>` suffix, as the **PVC name** (a DNS-1123 subdomain) — so validating it as a label keeps both valid. Rejecting an invalid name at `kubectl apply` (admission) makes the failure diagnosable instead of surfacing later as an opaque apiserver rejection when the controller creates the PVC/Pod; the controller re-checks it (and cross-entry uniqueness) as defense in depth.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      type: object
                    spec:
                      description: The volume's provisioning spec (size, access modes, storage class).
                      properties:
                        accessModes:
                          description: Access modes (e.g. `ReadWriteOnce`). Empty defers to the StorageClass/provisioner default.
                          items:
                            type: string
                          type: array
                        storage:
                          description: Requested storage size, mapped to `resources.requests.storage` on the materialized PVC (e.g. `10Gi`). Reuses [`ResourceQuantity`] so the lexical Kubernetes quantity form round-trips without precision loss.
                          type: string
                        storageClassName:
                          description: StorageClass to provision from. `None` uses the cluster's default class.
                          nullable: true
                          type: string
                        volumeMode:
                          description: Volume mode (`Filesystem` or `Block`). `None` defers to the Kubernetes default (`Filesystem`).
                          nullable: true
                          type: string
                      required:
                      - storage
                      type: object
                  required:
                  - metadata
                  - spec
                  type: object
                nullable: true
                type: array
              volumeClaimTemplatesPolicy:
                description: |-
                  Whether a Sandbox minted from this template may contribute its own [`VolumeClaimTemplate`]s on top of [`Self::volume_claim_templates`] (epic #603 Phase 5 / issue #608). Enforced at the controller's pod-creation edge by [`crate::merge_volume_claim_templates`], so every path that materializes a Pod — cold-start, warm-pool, and a hand-applied Sandbox CR — obeys the same rule. Tenant claims the policy forbids are suppressed (and surfaced as a status condition), never a hard failure.

                  `None` resolves to the default [`VolumeClaimTemplatesPolicy::Disallowed`]: a Sandbox's explicit claims are ignored and only this template's claims are provisioned. The platform owner opts a template into tenant-supplied storage by setting `Allowed` (additions only) or `Overrides` (additions plus by-name override).

                  `Option<T>` keeps the field non-required in the generated CRD schema and `skip_serializing_if` keeps `None` out of serialized YAML rather than emitting `volumeClaimTemplatesPolicy: null`.
                enum:
                - Disallowed
                - Allowed
                - Overrides
                nullable: true
                type: string
            required:
            - defaultResources
            - defaultRuntimeClass
            - defaultTimeoutSeconds
            - image
            type: object
        required:
        - spec
        title: SandboxTemplate
        type: object
    served: true
    storage: true
    subresources: {}
