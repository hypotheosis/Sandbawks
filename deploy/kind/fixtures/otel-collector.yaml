# Local OTLP collector for end-to-end observability validation (issue #301,
# OTel Phase 7). Stands up an `otel/opentelemetry-collector-contrib` instance
# in an `observability` namespace that accepts OTLP on :4317 (gRPC) and :4318
# (HTTP) and dumps every received signal — traces, metrics, logs — to its own
# stdout via the `debug` exporter. `kubectl logs` then shows the spans, so an
# operator can confirm all four sandbawks services
# (`sandbawks-api`, `sandbawks-controller`, `sandbawks-node`, `envd`) emit
# under one `trace_id` without standing up a full APM.
#
# This is the plaintext in-cluster collector the chart's `observability`
# block is designed to target (see deploy/helm/sandbawks/values.yaml): install
# the chart with
#   --set observability.enabled=true \
#   --set observability.endpoint=http://otel-collector.observability.svc:4318
# and the api / controller / node workloads export here.
#
# Apply/inspect/remove via the `just otel-collector-{up,logs,down}` recipes.
# NOT a production manifest: a single replica, no persistence, and a debug
# exporter that prints PII-bearing payloads in the clear — strictly a kind /
# dev validation aid. Real deployments point `observability.endpoint` at a
# hardened collector that forwards to Traceway with the vendor token.
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: sandbawks
    app.kubernetes.io/component: otel-collector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app.kubernetes.io/part-of: sandbawks
    app.kubernetes.io/component: otel-collector
data:
  # Collector pipeline: accept OTLP over both transports, fan every signal to
  # the `debug` exporter (the contrib image's stdout dumper; `verbosity:
  # detailed` prints full resource attributes and per-span trace_id/span_id so
  # the single-trace_id check is verifiable straight from `kubectl logs`).
  #
  # The collector's own telemetry log level is left at its `info` default ON
  # PURPOSE: the `debug` exporter writes its signal dump THROUGH that same
  # logger at info, so lowering the level to `warn` would silence the exporter
  # too — defeating the whole fixture.
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/part-of: sandbawks
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sandbawks
        app.kubernetes.io/component: otel-collector
      # NOTE: this raw manifest carries no `checksum/config` annotation (that
      # pattern needs Helm templating to hash the rendered ConfigMap, and this
      # is applied with plain `kubectl apply -f`). So editing the embedded
      # `config.yaml` ConfigMap above and re-applying will NOT roll the pod on
      # its own. The `just otel-collector-up` recipe runs a `rollout restart`
      # after apply to pick up config edits; if you apply this manifest
      # directly, follow with `kubectl -n observability rollout restart
      # deploy/otel-collector`.
    spec:
      containers:
        - name: otel-collector
          # Pinned contrib build. `--config` points at the mounted ConfigMap.
          image: docker.io/otel/opentelemetry-collector-contrib:0.123.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: "1", memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/part-of: sandbawks
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
