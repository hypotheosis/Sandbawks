{{- /*
Cluster-scoped RuntimeClass advertising the `sandbawks-runsc` handler that
the containerd-shim-sandbawks-v1 shim (Plan 07) registers. Sandbox Pods
opting into filesystem snapshot/restore are stamped with
`runtimeClassName: sandbawks-runsc` so the kubelet routes them to the
sandbawks shim instead of vanilla runsc. Additive to the `gvisor`
RuntimeClass from Plan 05; disable on clusters where the shim isn't
installed on every node.
*/ -}}
{{- if .Values.sandbawksRunsc.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sandbawks-runsc
  labels: {{- include "sandbawks.labels" . | nindent 4 }}
handler: sandbawks-runsc
{{- end }}
