{{- /*
Auto-generates the HMAC signing secret used by the api gateway when the
operator hasn't pointed `.Values.api.signingSecret.existingSecret` at
a pre-existing Secret. The 64-char `randAlphaNum` value rotates on every
`helm upgrade --install`, which is acceptable for MVP because unsigned
tokens have a max 24h TTL; production deployments should always set
`existingSecret` and rotate out-of-band.
*/ -}}
{{- if and .Values.api.enabled (not .Values.api.signingSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: sandbawks-api-signing
  labels: {{- include "sandbawks.labels" . | nindent 4 }}
type: Opaque
data:
  signing-secret: {{ randAlphaNum 64 | b64enc | quote }}
{{- end }}
