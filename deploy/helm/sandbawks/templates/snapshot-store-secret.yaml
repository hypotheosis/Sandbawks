{{- /*
Auto-generates the S3 access/secret-key pair the node DaemonSet uses to
read and write snapshots to the configured object store, unless the
operator has pinned `.Values.snapshotStore.existingSecret` at a Secret
they manage out-of-band. Mirrors the `api-signing-secret.yaml` pattern.

Unlike the api signing secret these credentials must NOT rotate on every
`helm upgrade --install` — rotating them would orphan every snapshot
already written to the bucket. The `helm.sh/resource-policy: keep`
annotation tells Helm to leave the Secret in place across uninstalls so
the same keys keep working; the `lookup` short-circuit below preserves
the existing data across upgrades.
*/ -}}
{{- /* Render the chart-managed Secret if the node DaemonSet, the controller's
retention sweeper (issue #186), OR the controller's usage metering/rollup
(epic #480) needs it — all mount the same snapshot-store credential keys.
`existingSecret` still suppresses the chart copy when the operator manages
credentials out-of-band. */ -}}
{{- $needsSecret := or .Values.node.enabled .Values.snapshotStore.retention.enabled .Values.usage.metering.enabled .Values.usage.rollup.enabled -}}
{{- if eq .Values.snapshotStore.provider "azure" }}
{{- /* Azure Blob (provider: azure). The account key is operator-supplied
(no auto-generation): rotating it would NOT orphan snapshots the way a new
S3 key pair would, so there is no `lookup` round-trip here. `keep` still
preserves it across uninstalls so a re-install keeps the same wiring. The
`azure.existingSecret` escape hatch suppresses this branch entirely. */ -}}
{{- if and $needsSecret (not .Values.snapshotStore.azure.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: sandbawks-snapshot-store
  labels: {{- include "sandbawks.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SANDBAWKS_AZURE_ACCOUNT_KEY: {{ required "snapshotStore.azure.accountKey is required when provider=azure and no existingSecret is set" .Values.snapshotStore.azure.accountKey | quote }}
{{- end }}
{{- else }}
{{- if and $needsSecret (not .Values.snapshotStore.existingSecret) }}
{{- $name := "sandbawks-snapshot-store" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $access := "" -}}
{{- $secret := "" -}}
{{- if $existing }}
{{- $access = index $existing.data "SANDBAWKS_S3_ACCESS_KEY" -}}
{{- $secret = index $existing.data "SANDBAWKS_S3_SECRET_KEY" -}}
{{- else }}
{{- $access = randAlphaNum 32 | b64enc -}}
{{- $secret = randAlphaNum 64 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "sandbawks.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SANDBAWKS_S3_ACCESS_KEY: {{ $access | quote }}
  SANDBAWKS_S3_SECRET_KEY: {{ $secret | quote }}
{{- end }}
{{- end }}
