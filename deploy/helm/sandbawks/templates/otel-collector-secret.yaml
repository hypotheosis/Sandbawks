{{- /*
Chart-managed Secret holding the downstream (Traceway) OTLP bearer token the
in-namespace collector authenticates with (issue #421). Rendered only when
the collector is enabled and the operator hasn't pointed
`observability.collector.exporter.existingTokenSecret` at a pre-existing
Secret.

The token lives ONLY here and is mounted into the collector Pod as the
`TRACEWAY_OTLP_TOKEN` env var — never into the api/controller/node workloads,
never into a sandbox Pod, and never into the rendered ConfigMap. This is the
whole point of the collector hop: the customer-controlled sandbox `envd`
exports plaintext and the credential stays on a trusted in-cluster service.

An operator-supplied `existingTokenSecret` must expose the raw token under a
`token` key.
*/ -}}
{{- if and .Values.observability.enabled .Values.observability.collector.enabled (not .Values.observability.collector.exporter.existingTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbawks.otelCollectorName" . }}
  labels: {{- include "sandbawks.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ required "observability.collector.exporter.token is required when observability.collector.enabled=true and no existingTokenSecret is set — Traceway rejects unauthenticated exports" .Values.observability.collector.exporter.token | b64enc | quote }}
{{- end }}
